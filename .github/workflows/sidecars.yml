name: Sidecars

# Builds and publishes per-app "sidecar" images (see apps/sidecar-containers.md).
# Only the sidecar(s) whose files actually changed are built - never a
# rebuild-everything job - via the detect job's matrix output.
#
# Publishes ghcr.io/freeshardbase/<app>-sidecar:<version> (<version> read
# from that sidecar's own VERSION file) on BOTH a pull request and a push to
# main - a PR publishes exactly the tag a later merge would also publish, so
# a PR's own custom-app smoke test, or an ad hoc trial-shard install, can
# pull a real image before the PR ever merges. That preview tag is a
# floating one: every push to the PR branch republishes it, same trust
# level as the PR's own code, no more and no less. "Refuse to republish"
# (see the `publish` job) only blocks a genuine version-number reuse with
# different content; publishing identical content to a tag that a PR itself
# already published is a safe no-op, so a later merge doesn't get blocked by
# its own PR's preview.
#
# Split into `build` (untrusted code execution, zero credentials) and
# `publish` (trusted static push, zero code execution) because a
# Dockerfile's RUN instructions execute arbitrary code during `docker build`
# itself, regardless of push:. A job that builds unreviewed instructions
# must never also hold a live registry-write token - see `build`'s comment
# below for how that's enforced, and `publish`'s for why it's safe to hold
# one.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/*/sidecar/**'
      - 'sidecar-template/sidecar/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/*/sidecar/**'
      - 'sidecar-template/sidecar/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      sidecars: ${{ steps.detect.outputs.sidecars }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Find changed sidecars
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            range="origin/$BASE_REF...HEAD"
          elif [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # first push on a new branch pointed at main: nothing to diff against
            range="$SHA~1..$SHA"
          else
            range="$EVENT_BEFORE..$SHA"
          fi

          changed=$(git diff --name-only $range -- 'apps/*/sidecar/**' 'sidecar-template/sidecar/**')
          echo "Changed sidecar files:"
          echo "$changed"

          # Each match looks like <root>/<app>/sidecar/<rest>. Derive the
          # sidecar's build context (everything up to and including
          # "sidecar") and its app name (the directory right before it).
          pairs=$(echo "$changed" | awk -F/ '
            { for (i=1; i<=NF; i++) {
                if ($i == "sidecar") {
                  ctx=$1; for (j=2; j<=i; j++) ctx = ctx "/" $j
                  print $(i-1) "|" ctx
                  break
                }
              }
            }' | sort -u)

          json="[]"
          if [ -n "$pairs" ]; then
            json=$(echo "$pairs" | awk -F'|' '{printf "{\"app\":\"%s\",\"context\":\"%s\"}\n", $1, $2}' | jq -s -c .)
          fi
          echo "Sidecars matrix: $json"
          echo "sidecars=$json" >> "$GITHUB_OUTPUT"

  # Builds whatever Dockerfile the triggering branch contains, for a PR or
  # for main alike. Deliberately holds no `packages: write` (or any other
  # elevated) permission - a Dockerfile's RUN instructions execute arbitrary
  # code during `docker build` itself, regardless of push:, so this job
  # can't be trusted with a live registry-write token. It hands its result
  # to `publish` as a plain file artifact instead of pushing it directly.
  build:
    needs: detect
    if: needs.detect.outputs.sidecars != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sidecar: ${{ fromJson(needs.detect.outputs.sidecars) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Read version
        id: version
        env:
          CONTEXT: ${{ matrix.sidecar.context }}
        run: echo "version=$(cat "$CONTEXT/VERSION" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.sidecar.context }}
          push: false
          load: true
          tags: ghcr.io/freeshardbase/${{ matrix.sidecar.app }}-sidecar:${{ steps.version.outputs.version }}

      - name: Save image to an artifact
        env:
          APP: ${{ matrix.sidecar.app }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker save "ghcr.io/freeshardbase/${APP}-sidecar:${VERSION}" -o "/tmp/${APP}-sidecar.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-image-${{ matrix.sidecar.app }}
          path: /tmp/${{ matrix.sidecar.app }}-sidecar.tar
          retention-days: 7

  # Never executes any code the triggering branch contributed: no docker
  # build, no `run:` step that interpolates branch-controlled content. It
  # only loads the artifact `build` already produced (a plain file, not
  # something that executes on load) and pushes it statically - so holding
  # packages: write here is safe even though `build`'s own Dockerfile input
  # is unreviewed. Skipped entirely for a pull_request from a fork, where
  # there's no reason to trust the branch at all.
  publish:
    needs: [detect, build]
    if: >-
      needs.detect.outputs.sidecars != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        sidecar: ${{ fromJson(needs.detect.outputs.sidecars) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Read version
        id: version
        env:
          CONTEXT: ${{ matrix.sidecar.context }}
        run: echo "version=$(cat "$CONTEXT/VERSION" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-image-${{ matrix.sidecar.app }}
          path: /tmp

      - name: Load image
        id: load
        env:
          APP: ${{ matrix.sidecar.app }}
        run: |
          docker load -i "/tmp/${APP}-sidecar.tar"
          id=$(docker images --no-trunc -q --filter "reference=ghcr.io/freeshardbase/${APP}-sidecar" | head -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish, refusing a genuine version-number reuse
        env:
          APP: ${{ matrix.sidecar.app }}
          VERSION: ${{ steps.version.outputs.version }}
          LOCAL_ID: ${{ steps.load.outputs.id }}
        run: |
          image="ghcr.io/freeshardbase/${APP}-sidecar:${VERSION}"
          if docker pull "$image" > /dev/null 2>&1; then
            remote_id=$(docker images --no-trunc -q "$image")
            if [ "$remote_id" != "$LOCAL_ID" ]; then
              echo "::error::$image already exists with different content. Bump ${APP}'s VERSION file."
              exit 1
            fi
            echo "$image already published with identical content - nothing to do."
            exit 0
          fi
          docker tag "$LOCAL_ID" "$image"
          docker push "$image"
